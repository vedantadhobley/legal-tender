# Wikidata Resolution Overrides
#
# Reviewable data-driven exceptions for the FEC-employer → Wikidata
# resolution pipeline. Each entry must include rationale + verification.
# This file is the ONLY place hardcoded resolution decisions live —
# the resolver code itself contains no per-name special cases.
#
# Two kinds of entries:
#
#   force_qid:    FEC name → Wikidata Q-id (when reconci.link's
#                 ranking is wrong but Wikidata HAS the right entity)
#
#   alias_to:    FEC name → another canonical name (when two FEC
#                 strings refer to the same entity but Wikidata lacks
#                 cross-aliases)
#
# When adding an entry:
#   1. Verify the Q-id by URL: https://www.wikidata.org/wiki/<Q-id>
#   2. Fill in rationale: what the search returns wrongly + why this
#      override is the right call
#   3. Add `verified_at` (today's date) and `verified_by` (your handle)
#
# When deleting an entry:
#   - Delete it. If reconci.link improves to the point where the
#     override becomes unnecessary, the resolver code doesn't need to
#     change — just remove the entry here.
#
# Schema:
#   force_qid:
#     - fec_name: "STRING"   # uppercase, FEC-as-listed
#       wikidata_id: "Q123"  # target Wikidata Q-id
#       rationale: "..."     # why search returns wrong + why this is right
#       verified_at: "YYYY-MM-DD"
#       verified_by: "handle"
#
#   alias_to:
#     - fec_name: "STRING"
#       canonical: "TARGET_FEC_NAME"  # some other entry that resolves correctly
#       rationale: "..."
#       verified_at: "YYYY-MM-DD"
#       verified_by: "handle"

force_qid:
  - fec_name: "NEA"
    wikidata_id: "Q3111510"
    rationale: |
      reconci.link ranks "Newspaper Enterprise Association" (Q58432485,
      a defunct newspaper syndicate from 1902) ahead of "National
      Education Association" (Q3111510, the teachers' union with 3M+
      members). For FEC donor employers, "NEA" overwhelmingly means the
      teachers' union — the press agency hasn't been a meaningful
      donation source for decades. The Wikipedia article and English
      sitelinks confirm Q3111510 is the more prominent entity.
    verified_at: "2026-05-10"
    verified_by: "vedanta"

  - fec_name: "CITADEL"
    wikidata_id: "Q2974366"
    rationale: |
      reconci.link's top hit varies between "Citadel" the 1985 video
      game (Q5122370) and the actual hedge fund "Citadel Enterprise
      Americas LLC" (Q2974366) depending on the search day. The
      ontology filter rejects the video game (Q7889 type) but other
      candidates (sports teams, fictional citadels, etc.) sometimes
      score above the hedge fund. Force the parent corporate entity.
    verified_at: "2026-05-10"
    verified_by: "vedanta"

  - fec_name: "CITADEL ASSET MANAGEMENT"
    wikidata_id: "Q2974366"
    rationale: |
      Same Citadel parent. The "ASSET MANAGEMENT" sub-entity doesn't
      have its own Wikidata Q-id; rolling up to the parent matches the
      donor-attribution intent.
    verified_at: "2026-05-10"
    verified_by: "vedanta"

# Empty initially — populated as the validation harness surfaces real
# alias-merge cases that Wikidata can't bridge on its own (e.g. Adelson
# Drug Clinic + Adelson Clinic when Wikidata has neither).
alias_to: []
