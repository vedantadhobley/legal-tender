# Development Docker Compose for Legal Tender
#
# Port allocation: legal-tender uses 4300-4309 (dev)
#   4300: Dagster UI
#   4301: ArangoDB Web UI
#
# Internal ports (not exposed to host):
#   - postgres:5432 (Dagster metadata)
#   - arangodb:8529 (Graph database)
#
# External services (via Tailscale FQDN — bare hostname won't resolve in Docker):
#   - <llm-host>:3101 (LLM chat/thinking API — Qwen3.5-35B-A3B)
#   - <llm-host>:3103 (Embedding API — Qwen3-Embedding-8B)
#   Set EMBEDDING_HOST in .env to your tailnet FQDN (see .env.example).
#
# Storage:
#   All persistent data lives at ~/workspace/data/legal-tender/ with subdirs:
#   - raw/        Raw FEC downloads + reference data (legislators, headers)
#   - dumps/      ArangoDB JSONL dumps (fast reload, fec/enriched/aggregation/graphs)
#   - cache/      Regeneratable API caches (congress_api, etc.)

name: legal-tender-dev

services:
  # DAGSTER WEBSERVER - UI and asset management
  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: legal-tender-dev-webserver
    command: dagster dev -h 0.0.0.0 -p 3000 -w /workspace/workspace.yaml
    ports:
      - "4300:3000"  # Dagster UI
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /workspace
      PYTHONPATH: /workspace
      PYTHONUNBUFFERED: "1"
      # Storage paths (inside container, mapped to ~/workspace/data/legal-tender/)
      LEGAL_TENDER_STORAGE: /storage
      LEGAL_TENDER_RAW_DIR: /storage/raw
      LEGAL_TENDER_DUMPS_DIR: /storage/dumps
      LEGAL_TENDER_CACHE_DIR: /storage/cache
      # ArangoDB connection (internal network)
      ARANGO_HOST: legal-tender-dev-arango
      ARANGO_PORT: "8529"
      ARANGO_USER: root
      ARANGO_PASSWORD: ltpass
      ARANGO_DB: legal_tender
      # Dagster Postgres connection
      DAGSTER_PG_USER: ltuser
      DAGSTER_PG_PASSWORD: ltpass
      DAGSTER_PG_HOST: legal-tender-dev-postgres
      DAGSTER_PG_DB: dagster
      DAGSTER_COMPUTE_LOGS_DIR: /workspace/compute_logs
    volumes:
      - .:/workspace  # Mount entire project for live development
      - ~/workspace/data/legal-tender:/storage  # Persistent storage (raw + dumps + cache)
    depends_on:
      postgres:
        condition: service_healthy
      arangodb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/server_info"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - legal-tender-dev
      - luv-dev

  # NOTE: dagster dev (in webserver) already runs the daemon internally,
  # so we don't need a separate daemon container for development.
  # The daemon container is only needed for production (dagster-webserver + dagster-daemon)

  # POSTGRESQL - Dagster metadata storage
  postgres:
    image: postgres:15-alpine
    container_name: legal-tender-dev-postgres
    # No port exposed - internal only
    environment:
      POSTGRES_USER: ltuser
      POSTGRES_PASSWORD: ltpass
      POSTGRES_DB: dagster
    volumes:
      - legal-tender-dev-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ltuser -d dagster"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - legal-tender-dev

  # ARANGODB - Graph database for money flow tracking
  # Memory-mapped storage - uses disk with smart caching
  arangodb:
    image: arangodb:3.11
    container_name: legal-tender-dev-arango
    ports:
      - "4301:8529"  # ArangoDB Web UI
    environment:
      ARANGO_ROOT_PASSWORD: ltpass
      # Memory budget for ArangoDB. LLMs run on joi, leaving this 128GB
      # box with ~95GB available. Bumped 32→64GB so any auto-tuned knobs
      # we don't explicitly override get the larger budget too.
      ARANGODB_OVERRIDE_DETECTED_TOTAL_MEMORY: "68719476736"  # 64GB
    # Performance tuning for AMD Ryzen AI MAX+ 395 (16c/32t, 128GB)
    command:
      - arangod
      - --server.authentication=true
      - --config=/etc/arangodb3/arangod.conf
      # Threading: let ArangoDB use up to 64 request handling threads
      - --server.maximal-threads=64
      - --server.minimal-threads=16
      - --server.io-threads=16
      # Query engine: 32GB per-query ceiling. Big traversals (multi-hop
      # PAC chains, funding-channel computation) build large intermediate
      # result sets; 8GB was getting close to limits.
      - --query.memory-limit=34359738368
      # RocksDB: parallel flush/compaction for fast bulk writes
      - --rocksdb.num-threads-priority-high=8
      - --rocksdb.num-threads-priority-low=8
      - --rocksdb.max-background-jobs=16
      # RocksDB block cache: 32GB. THE primary read-perf lever. Hot
      # SST index pages stay resident, eliminating disk hits during
      # graph traversals. Auto-default would have been ~19GB at the
      # 64GB total budget; we explicitly raise it for index-heavy reads.
      - --rocksdb.block-cache-size=34359738368
      # RocksDB write buffers: bigger memtables = bigger insert batches
      # = fewer SST flushes = faster bulk loads. Sized for the indiv
      # parse / graph-build workloads (millions of rows per asset).
      - --rocksdb.write-buffer-size=1073741824        # 1GB per memtable
      - --rocksdb.max-write-buffer-number=8
      - --rocksdb.total-write-buffer-size=17179869184 # 16GB total
      - --rocksdb.max-total-wal-size=2147483648       # 2GB WAL
      # ArangoDB's own cache (separate from RocksDB block cache). Edge
      # metadata + frequently-accessed documents stay in memory.
      - --cache.size=17179869184                      # 16GB
    volumes:
      - legal-tender-dev-arango-data:/var/lib/arangodb3
      - legal-tender-dev-arango-apps:/var/lib/arangodb3-apps
    healthcheck:
      test: ["CMD", "arangosh", "--server.password", "ltpass", "--javascript.execute-string", "db._version()"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - legal-tender-dev
      - luv-dev  # Allow cross-project access if needed

volumes:
  legal-tender-dev-postgres-data:
    name: legal-tender-dev-postgres-data
    driver: local
  legal-tender-dev-arango-data:
    name: legal-tender-dev-arango-data
    driver: local
  legal-tender-dev-arango-apps:
    name: legal-tender-dev-arango-apps
    driver: local
  # NOTE: FEC data and Arango dumps stored at ~/workspace/data/legal-tender/ (bind mount)
  # mounted as bind volume, not Docker volume

networks:
  # Internal network for this project
  legal-tender-dev:
    name: legal-tender-dev
    driver: bridge
  
  # Shared network - cross-project communication
  luv-dev:
    external: true
