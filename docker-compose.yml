# Production Docker Compose for Legal Tender
#
# HTTP services reachable via Caddy on the workspace `proxy` network:
#   legal-tender-prod-webserver.luv   → dagster-webserver:3000
#   legal-tender-prod-arango.luv      → arangodb:8529
# See deploy/INFRA-NOTES.md for the Caddyfile entries on luv.
#
# Internal ports (not exposed to host; reachable on luv-prod / legal-tender-prod):
#   - postgres:5432 (Dagster metadata)
#   - arangodb:8529 (Graph database)
#   - dagster-webserver:3000
#
# External services (via Tailscale FQDN — bare hostname won't resolve in Docker):
#   - <llm-host>:3101 (LLM chat/thinking API — Qwen3.5-35B-A3B)
#   - <llm-host>:3103 (Embedding API — Qwen3-Embedding-8B)
#   Set EMBEDDING_HOST in .env to your tailnet FQDN (see .env.example).
#
# Storage:
#   All persistent data lives at ~/workspace/data/legal-tender/ with subdirs:
#   - raw/        Raw FEC downloads + reference data (legislators, headers)
#   - dumps/      ArangoDB JSONL dumps (fast reload, fec/enriched/aggregation/graphs)
#   - cache/      Regeneratable API caches (congress_api, etc.)

name: legal-tender-prod

services:
  # DAGSTER WEBSERVER - UI and asset management
  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: legal-tender:latest
    container_name: legal-tender-prod-webserver
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /app/workspace.yaml
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /app
      PYTHONPATH: /app
      # Storage paths
      LEGAL_TENDER_STORAGE: /storage
      LEGAL_TENDER_RAW_DIR: /storage/raw
      LEGAL_TENDER_DUMPS_DIR: /storage/dumps
      LEGAL_TENDER_CACHE_DIR: /storage/cache
      # ArangoDB connection
      ARANGO_HOST: legal-tender-prod-arango
      ARANGO_PORT: "8529"
      ARANGO_USER: root
      ARANGO_PASSWORD: ltpass
      ARANGO_DB: legal_tender
      # Dagster Postgres connection
      DAGSTER_PG_USER: ltuser
      DAGSTER_PG_PASSWORD: ltpass
      DAGSTER_PG_HOST: legal-tender-prod-postgres
      DAGSTER_PG_DB: dagster
      DAGSTER_COMPUTE_LOGS_DIR: /app/compute_logs
    volumes:
      - ~/workspace/data/legal-tender:/storage  # Persistent storage (raw + dumps + cache)
    depends_on:
      postgres:
        condition: service_healthy
      arangodb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/server_info"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - legal-tender-prod
      - luv-prod
      - proxy

  # DAGSTER DAEMON - Schedules and sensors
  dagster-daemon:
    image: legal-tender:latest
    container_name: legal-tender-prod-daemon
    command: dagster-daemon run
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /app
      PYTHONPATH: /app
      # Storage paths
      LEGAL_TENDER_STORAGE: /storage
      LEGAL_TENDER_RAW_DIR: /storage/raw
      LEGAL_TENDER_DUMPS_DIR: /storage/dumps
      LEGAL_TENDER_CACHE_DIR: /storage/cache
      # ArangoDB connection
      ARANGO_HOST: legal-tender-prod-arango
      ARANGO_PORT: "8529"
      ARANGO_USER: root
      ARANGO_PASSWORD: ltpass
      ARANGO_DB: legal_tender
      # Dagster Postgres connection
      DAGSTER_PG_USER: ltuser
      DAGSTER_PG_PASSWORD: ltpass
      DAGSTER_PG_HOST: legal-tender-prod-postgres
      DAGSTER_PG_DB: dagster
      DAGSTER_COMPUTE_LOGS_DIR: /app/compute_logs
    volumes:
      - ~/workspace/data/legal-tender:/storage
    depends_on:
      postgres:
        condition: service_healthy
      dagster-webserver:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - legal-tender-prod

  # POSTGRESQL - Dagster metadata storage
  postgres:
    image: postgres:15-alpine
    container_name: legal-tender-prod-postgres
    environment:
      POSTGRES_USER: ltuser
      POSTGRES_PASSWORD: ltpass
      POSTGRES_DB: dagster
    volumes:
      - legal-tender-prod-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ltuser -d dagster"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - legal-tender-prod

  # ARANGODB - Graph database for money flow tracking
  arangodb:
    image: arangodb:3.11
    container_name: legal-tender-prod-arango
    environment:
      ARANGO_ROOT_PASSWORD: ltpass
      # Memory budget for ArangoDB. LLMs run on joi, leaving this 128GB
      # box with ~95GB available. Bumped to 64GB so any auto-tuned knobs
      # we don't explicitly override get the larger budget too.
      ARANGODB_OVERRIDE_DETECTED_TOTAL_MEMORY: "68719476736"  # 64GB
    # Performance tuning for AMD Ryzen AI MAX+ 395 (16c/32t, 128GB)
    command:
      - arangod
      - --server.authentication=true
      - --config=/etc/arangodb3/arangod.conf
      - --server.maximal-threads=64
      - --server.minimal-threads=16
      - --server.io-threads=16
      # Query engine: 32GB per-query ceiling for big traversals.
      - --query.memory-limit=34359738368
      # RocksDB: parallel flush/compaction
      - --rocksdb.num-threads-priority-high=8
      - --rocksdb.num-threads-priority-low=8
      - --rocksdb.max-background-jobs=16
      # RocksDB block cache: 32GB. Hot index pages resident → no disk
      # hits on graph traversals. Primary read-perf lever.
      - --rocksdb.block-cache-size=34359738368
      # RocksDB write buffers: 1GB per memtable, 16GB total ceiling.
      # Fewer SST flushes during bulk loads.
      - --rocksdb.write-buffer-size=1073741824
      - --rocksdb.max-write-buffer-number=8
      - --rocksdb.total-write-buffer-size=17179869184
      - --rocksdb.max-total-wal-size=2147483648
      # ArangoDB's own edge/document cache (separate from block cache).
      - --cache.size=17179869184
    volumes:
      - legal-tender-prod-arango-data:/var/lib/arangodb3
      - legal-tender-prod-arango-apps:/var/lib/arangodb3-apps
    healthcheck:
      test: ["CMD", "arangosh", "--server.password", "ltpass", "--javascript.execute-string", "db._version()"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - legal-tender-prod
      - luv-prod
      - proxy

volumes:
  legal-tender-prod-postgres-data:
    name: legal-tender-prod-postgres-data
    driver: local
  legal-tender-prod-arango-data:
    name: legal-tender-prod-arango-data
    driver: local
  legal-tender-prod-arango-apps:
    name: legal-tender-prod-arango-apps
    driver: local
  # NOTE: FEC data and Arango dumps stored at ~/workspace/data/legal-tender/ (bind mount)
  # mounted as bind volume, not Docker volume

networks:
  # Internal network for this project
  legal-tender-prod:
    name: legal-tender-prod
    driver: bridge
  
  # Shared network - cross-project communication
  luv-prod:
    external: true

  # Caddy reverse proxy fronts HTTP services here.
  # See deploy/INFRA-NOTES.md and ~/workspace/proxy/caddy/caddy.d/legal-tender.caddy.
  proxy:
    name: proxy
    external: true
